<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Log In | DreavelleVerse</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>
            <a href="index.html">DreavelleVerse</a>
        </h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="library.html">Library</a>
            <a href="write.html">Write</a>
            <a href="notifications.html">Notifications</a>
            <a href="login.html">Log In</a>
            <a href="signup.html" class="signup-link">Sign Up</a>
        </nav>
    </header>

    <main>

        <section class="signup-page">

            <div class="signup-container">

                <p class="signup-welcome">
                    Welcome Back
                </p>

                <h2>Log In</h2>

                <p class="signup-intro">
                    Continue your journey in DreavelleVerse.
                </p>

                <form id="login-form">

                    <label for="login-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="submit"
                        class="signup-button"
                    >
                        Log In
                    </button>

<p style="text-align: right; margin: 10px 0;">
    <a href="forgot-password.html">Forgot Password?</a>
</p>

                    <p
                        id="login-message"
                        class="signup-message"
                    ></p>

                </form>

                <p class="signup-login-text">
                    Don't have an account?
                    <a href="signup.html">Create an account</a>
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

<script src="reading-access.js?v=20261024-gate1"></script>
</body>

</html>
