
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | DreavelleVerse</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1><a href="index.html">DreavelleVerse</a></h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="library.html">Library</a>
            <a href="write.html">Write</a>
            <a href="notifications.html">Notifications</a>
            <a href="login.html">Log In</a>
            <a href="signup.html" class="signup-link">Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="signup-page">
            <div class="signup-container">
                <p class="signup-welcome">Account Recovery</p>
                <h2>Forgot Password?</h2>
                <p class="signup-intro">
                    Enter your email address to receive a password reset link.
                </p>

                <form id="forgot-password-form" class="signup-form">
                    <label for="reset-email">Email</label>
                    <input
                        type="email"
                        id="reset-email"
                        placeholder="Enter your email"
                        required
                    >

                    <button type="submit" class="signup-button">
                        Send Reset Link
                    </button>

                    <p id="reset-message" class="signup-message"
                       role="status" aria-live="polite"></p>
                </form>

                <p class="signup-login-text">
                    Remember your password?
                    <a href="login.html">Back to Log In</a>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById("forgot-password-form")
            .addEventListener("submit", async function (event) {
                event.preventDefault();

                const email = document
                    .getElementById("reset-email").value.trim();
                const message = document
                    .getElementById("reset-message");

                message.textContent = "Sending reset link...";

                const client = window.supabaseClient;

                if (!client || !client.auth) {
                    message.textContent =
                        "Password recovery is unavailable. Please try again later.";
                    return;
                }

                const { error } = await client.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            "https://dreavelleverse.com/reset-password.html"
                    }
                );

                if (error) {
                    message.textContent = error.message;
                } else {
                    message.textContent =
                        "If an account exists for this email, " +
                        "a password reset link will be sent.";
                }
            });
    </script>
</body>
</html>
