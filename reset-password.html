
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DreavelleVerse</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1><a href="index.html">DreavelleVerse</a></h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="library.html">Library</a>
            <a href="write.html">Write</a>
            <a href="notifications.html">Notifications</a>
            <a href="login.html">Log In</a>
            <a href="signup.html" class="signup-link">Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="signup-page">
            <div class="signup-container">
                <p class="signup-welcome">Account Recovery</p>
                <h2>Reset Password</h2>
                <p class="signup-intro">
                    Enter your new password below.
                </p>

                <form id="reset-password-form">
                    <label for="new-password">New Password</label>
                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm new password"
                        minlength="8"
                        required
                    >

                    <button type="submit" class="signup-button">
                        Update Password
                    </button>

                    <p id="reset-message"
                       class="signup-message"
                       role="status"
                       aria-live="polite"></p>
                </form>

                <p class="signup-login-text">
                    <a href="login.html">Back to Log In</a>
                </p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        const resetForm = document.getElementById("reset-password-form");
        const resetMessage = document.getElementById("reset-message");
        const resetButton = resetForm.querySelector("button");

        let recoveryVerified = false;

        const client = window.supabaseClient;

        if (!client || !client.auth) {
            resetMessage.textContent =
                "Password recovery is unavailable.";
            resetButton.disabled = true;
        } else {
            client.auth.onAuthStateChange((event) => {
                if (event === "PASSWORD_RECOVERY") {
                    recoveryVerified = true;
                    resetMessage.textContent =
                        "Recovery link verified. Enter your new password.";
                }
            });

            client.auth.initialize().then(({ error }) => {
                if (error) {
                    resetMessage.textContent =
                        "Invalid or expired recovery link. Request a new one.";
                }
            });
        }

        resetForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoveryVerified) {
                resetMessage.textContent =
                    "Please open a valid password recovery link first.";
                return;
            }

            const password =
                document.getElementById("new-password").value;
            const confirmation =
                document.getElementById("confirm-password").value;

            if (password !== confirmation) {
                resetMessage.textContent =
                    "Passwords do not match.";
                return;
            }

            resetButton.disabled = true;
            resetMessage.textContent = "Updating password...";

            const { error } = await client.auth.updateUser({
                password: password
            });

            if (error) {
                resetMessage.textContent = error.message;
                resetButton.disabled = false;
            } else {
                resetMessage.textContent =
                    "Password updated successfully! You can now log in.";
                recoveryVerified = false;
                resetForm.reset();
            }
        });
    </script>
</body>
</html>
